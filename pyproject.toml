[project]
name = "automation"
version = "0.1.0"
description = "Browser-use agent framework: authenticated login, task runs, telemetry collectors, and quality audits with HTML reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.13.1",
    "groq>=1.0.0",
    "playwright>=1.60.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
automation = "automation.__main__:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automation"]

# Task registry — the single place tasks are defined (loaded by automation/tasks.py).
# Run one with:  automation --task <key>     or a suite:  automation --suite tag:sales
#
# Each entry:
#   prompt      (required) the task, written exactly as a user would type it. NO login steps:
#               the framework logs in itself before the agent starts — say "go to Bookkeeping
#               module", never "go to <url> and login using ...".
#   marker      (optional) network ground-truth URL fragment: a successful POST/PUT/PATCH to a
#               URL containing it proves the record saved. OMIT it when a task has no known
#               create-write (verification / read-only flows) — the gate is then disabled and
#               success comes from the segment gates. A missing marker is never an
#               error.
#   tags        (optional) suite selection groups (--suite tag:nps).
#   assertions  (optional) per-task overrides for pipeline/assertions.py.
#   subtasks    (optional) escape hatch: a declared subtask split (prompt/values/marker/
#               postcondition/tab_url per item), only for tasks the LLM decomposer keeps
#               splitting wrongly. tab_url (absolute http(s) URL) runs that subtask in a
#               separate helper tab at that site — opened before the subtask, closed when
#               it ends; the app page is never navigated. Facts found there are captured
#               with extract_data and re-read FRESH on every replay.
#
# CRITICAL: prompt text is identity. subtask_store.task_id hashes the prompt to key its cached
# decomposition, so rewording a prompt (words, not whitespace) orphans that cache and its
# library reuse. tests/test_tasks.py pins every prompt's id for exactly this reason.


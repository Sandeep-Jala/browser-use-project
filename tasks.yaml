# ================================================================ NPS survey tests
# Verification flows on the admin side — no known create-write markers, so success comes
# from the segment gates + the judge. (Test Case 1 in the source doc is empty and skipped.)
nps_02_review_for_dropdown:
  prompt: >-
    Navigate to the user profile icon and click on setting and go to "Practice Profile" under
    "Practice Config", then under the "basic info" go to "Practice Properties" to locate the
    “Client Review” setting and note the currently selected option; Next go back to clients
    section and select a 290 CREW LIMITED business name. In the Profile section, go to the Assignment
    section and capture the names of both the Accountant and Account Manager, then go to the
    Reviews section, click the “Send NPS Survey Request” icon, and verify that the “Review
    for” dropdown value matches the correct user based on the selected Client Review setting;
    finally, return to Practice Properties and click on the pencil icon of this section,
    change the “Client Review” setting to a different option and save it, go back to the same
    business’s Reviews section and click on “Send NPS Survey Request” icon and confirm that
    the “Review for” dropdown updates correctly according to the new setting. Then Again
    return to Practice Properties and click on the pencil icon of this section, change the
    “Client Review” setting to a different option other than the previous ones and save it,
    go back to the same business’s Reviews section and click on “Send NPS Survey Request”
    icon. Confirm that the “Review for” dropdown updates correctly according to this new
    setting.
  tags: [nps]

nps_03_mandatory_review_for:
  prompt: >-
    Go to clients section and select a business name randomly. In the "Profile" section, go
    to the "Reviews" section and click the "Send NPS survey request" icon and attempt to send
    an NPS mail without selecting a 'Review for' option. Verify that the mail is not sent.
  tags: [nps]

nps_04_review_for_tag:
  prompt: >-
    Go to clients section and select a business name randomly. In the "Profile" section, go
    to the "Reviews" section and click the "Send NPS survey request" icon. select a name from
    'Review for' dropdown and verify that the selection dropdown correctly updates name
    dynamically in the email template.
  tags: [nps]

nps_05_cc_bcc:
  prompt: >-
    Navigate to the user profile icon and click on setting and go to "Practice Profile" under
    "Practice Config", then under the "basic info" go to the Emails section. Find the "CCs"

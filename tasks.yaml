# RTI payrun-processing chain: run Save/Next through every employee, handle the min-wage-error
# and pop-up branches, add an expenses/benefit + addition on employee 8, submit the FPS on the
# 2nd-last employee, roll the pay date to next month, and set the client sort order. Multi-write
# chain with conditional branches, so marker is omitted (no single fragment gates every write).
payroll_rti_process_old:
  prompt: >-
    go to Payroll module, search and select FOOD LIMITED business name, go to Payroll & RTI, Set the date to May-26, click Save & Next. If a pop up appears, select 'don't show this again' and click Process.
    Process the existing employees one at a time by clicking Save & Next, and after each click
    check that the next employee has loaded, if the Save & Next button is disabled, Move on to the next employee. stopping as soon as Aran Allan is the employee shown. If you see an error
    'The employer pay is lower than the minimum wage rate', click Add Payment, set Amount to
    5000, and click Save & Next. With Aran Allan shown as the current employee, click Add
    Expenses or Benefits, set Type to 'Assets transferred' from April 2026 to May 2026,
    set Cost to 200,set Employee contribution to 100, and click Save, then select Addition or Deduction, set Type to
    'Additions', amount is 500, period to is May 26, name is bonus and click Save. Continue
    clicking Save & Next one employee at a time in the same way, if the Save and next is disabled move on to the next employee, until Bruce Wright
    is the employee shown. Then select bulk upload FPS, click the FPS button next to Save & Next at the bottom of the employee list,click on employee checkbox, click on the checkbox of the employee we added earlier,Click on FPS, select document
    New_Employees_List_-_WI_LTD.csv, and Submit. Then go to Payroll & RTI, change the date
    to next month, and click Save & Next 3 times. Then go to clients, go to practice
    settings, click edit, select alphabetic order A to Z, and save.
  tags: [payroll]

payroll_rti_process:
  prompt: >-
    Go to the Payroll module, search for and select the business name FOOD
    LIMITED, then go to Payroll & RTI, in the combobox select Monthly and the combobox next to it select May-26, and click
    Save & Next. If a popup appears at any point after clicking Save & Next,
    tick 'Don't show this again', click Process, and continue. Now process
    the existing employees one at a time by repeating the following steps
    for each employee: first read the name of the employee currently shown;
    if the employee shown is Aran Allan, stop repeating and do not click
    Save & Next again; otherwise, if the error 'The employer pay is lower
    than the minimum wage rate' is shown, click Add Payment, set Amount to
    5000, and click Save & Next; if Save & Next is disabled for this
    employee, do not click it and instead select the next employee in the
    list directly; in all other cases click Save & Next and wait until the
    next employee has fully loaded before doing anything else. Keep
    repeating those steps until Aran Allan is the employee shown. With
    Aran Allan shown as the current employee, click Add Expenses or
    Benefits, set Type to 'Assets transferred', set the period from April
    2026 and set period to May 2026, set Cost to 200, set Employee contribution to 100,
    and click Save; then select Addition or Deduction, set Type to
    'Additions', set Amount to 500, set Period to May 26, set Name to
    bonus, and click Save. After saving, continue processing employees one
    at a time by repeating exactly the same steps as before: read the name
    of the employee currently shown; if the employee shown is Bruce Wright,
    stop repeating and do not click Save & Next again; otherwise handle the
    minimum wage error and a disabled Save & Next the same way as before,
    and in all other cases click Save & Next and wait for the next employee
    to load. Keep repeating until Bruce Wright is the employee shown. With
    Bruce Wright shown, select bulk upload FPS which is a button next
    to Save & Next, click the the checkbox in the grid header row, left of 'Employees', click the checkbox of Aran Allan, click
    FPS, select the document New_Employees_List_-_WI_LTD.csv, and click
    Submit. Then go to Payroll & RTI,Go to Pay Runs tab, change the combobox value for period to Jun-26, and click Save & Next exactly 3 times, waiting for the
    screen to update after each click and stopping after the third click.
    Finally, go to Clients, go to Practice Settings, click Edit, select
    alphabetic order A to Z, and click Save. The task is complete after
    that final Save; take no further actions.
  tags: [payroll]

# payroll_food_limited_e2e followed by payroll_rti_process, as ONE run: the two halves are
# concatenated verbatim (both keep their own "go to Payroll module, search and select FOOD
# LIMITED" opening — the e2e half ends inside the data-request area, so the RTI half really
# does have to re-enter Payroll & RTI, and the shared nav sentence stays a standalone,
# library-reused subtask). Needs ~20 subtasks, which is why MAX_SUBTASKS was raised to 24.
# Marker omitted: this chain commits many writes (employee create, forecast saves,
# data-request send, payrun saves, FPS submit, settings save) and no single URL fragment
# gates them all — success comes from the segment gates + judge.
payroll_food_limited_e2e_rti:
  tags: [payroll]
  subtasks:
    - prompt: >-
        Go to the Payroll module, search for and select the business name CREAMOS LTD, then
        go to the Employee section.
    - prompt: >-
        Open a new tab and go to https://www.fakenamegenerator.com/gen-male-gd-uk.php (this
        URL directly shows a freshly generated identity: male, Scottish name set, United
        Kingdom). From the generated identity, note and remember exactly these details for use
        in all later steps: the Name, the Gender (Male), the Address, and the Date of Birth.
    - prompt: >-
        Return to the Payroll tab and click Add Employee, then fill in the form using the
        noted details: enter the noted name, address, and gender; enter the noted date of
        birth converted to dd/mm/yyyy format; set the join date to 06/04/2026; set Join With
        to 'Existing employee'; set the NI number to AB124557C; set NI Category to A; set Gross Pay to 3500; select Student Loan
        with loan start date as 06/04/2026; select Postgraduate Loan with loan start date as 06/04/2026 and with loan end date
        01/07/2027; then click Save.
    - prompt: >-
        Next go to Pay Forecast,Refresh the page and then type the noted employee name into the combobox and select
        the employee, and wait until the employee's pay rows have loaded.
    - prompt: >-
        Once the pay rows are loaded, set the pay of Dec-26 to 5000; this also raises the
        pay shown for the months after it, which is normal — leave those as they are. Then
        set the net pay of Feb-27 to 4000 using the Net to Gross option: click the pencil
        icon at the right end of the Feb-27 row, and in thepopup that opens, type 4000 into the Net amount box beside the £ sign (it starts at 0; do not type into the grid's own pay cells
        behind the popup) and click Calculate. The popup closes on Calculate and the Feb-27 row then shows a £4,000.00
        net pay; if the popup closed before you clicked Calculate or the box would not
        take the value, reopen it with the same pencil icon and enter it again.
    - prompt: >-
        Then click Download and select PDF, then click Download again and select Excel.
    - prompt: >-
        Then go to Data Request, click Add Request, click Payroll Review, and click
        Standard. Scroll down inside the employee list itself, not the page (only a
        window of rows is rendered at once), until the noted employee's name comes into
        view, tick the checkbox on that employee's row, and click Save.
    - prompt: >-
        In the Send Email section that opens, open the From dropdown and select the no-reply
        option, then click Send; if the Send Email section has not closed after clicking Send, click Send again.
        If the email was not sent, it is saved as Drafted; click the email button next to
        the Drafted status to reopen the Send Email section,open the From dropdown and select the no-reply option, then click Send.
    - prompt: >-
        Then, in the Data Request list, go to the top row (S.No. 1, the newest request) and
        click the blue Sent badge in its Status column to open the Payroll Status dialog; in
        that dialog set Status to Submitted, type well done in the Notes field, and click
        Save.
    - prompt: >-
        Then click the ref. no. link on that same top row to open the Payroll Review panel,
        tick the Select Employee checkbox at the top of that panel so that the Verify button
        becomes enabled, and click Verify. The task is complete after clicking Verify.
      # # Pure click sequence that classifies judge only because the button is named
      # # "Verify" — declared action so it records/replays like any other slice.
      # kind: action
    - prompt: >-
        then go to Payroll & RTI, in the combobox select Monthly and the combobox next to it
        select Apr-26, and click Save & Next.
    - prompt: >-
        If a popup appears at any point after clicking Save & Next, tick 'Don't show this
        again', click Process, and continue.
      # The popup only appears sometimes: the probe decides its presence deterministically,
      # so the FALSE branch is a zero-LLM no-op and the TRUE branch records/replays.
      probe: {text_visible: "Don't show this again"}
    - prompt: >-
        Click Save & Next for the next 6 employees: exactly 6 clicks, waiting for the next
        employee to fully load after each click.
    - prompt: >-
        With the 7th employee of the pay run now shown, click Add Expenses or Benefits, set
        Type to 'Assets transferred', set the period from Apr-26 and set period to May-26, set Cost to 200, set Employee contribution to 100, and click Save. Add this
        expense exactly once: the dialog simply closes on Save with no confirmation
        message, and the grid then lists the expense at its net value 100.00 (the 200 cost
        minus the 100 contribution), which is a successful add; do not click Add Expenses
        or Benefits again;
    - prompt: >-
        then click the + next to the Additions or Deductions section to open the Add Addition
        or Deduction dialog, set Type to 'Additions', set Amount to 500, set Period to May 26,
        set Name to Bonus, and click Save. Add this bonus exactly once too: this Save also
        closes silently with no confirmation message; do not reopen the dialog or add it
        again.
    - prompt: >-
        Then click Save & Next for the next 5 employees in the same way: exactly 5 more
        clicks, waiting for the next employee to fully load after each click.
    - prompt: >-
        Then select FPS which is a button next to Save & Next. The checkbox in
        the grid header row, left of 'Employees', selects or unselects all employees at
        once; use it to unselect all employees first, then click the 4th Employee checkbox in the grid, click FPS on the bottom, select the document New_Employees_List_-_WI_LTD.csv, and
        click Submit.
      allow_write_refusal: true
    - prompt: >-
        If an error is shown after Submit, click Cancel to close it.
      probe: {text_visible: "already submitted"}
    - prompt: >-
        Then go to Payroll & RTI,Go to Pay Runs tab, change the combobox value for period to
        May-26, and click Save & Next exactly 3 times.
    - prompt: >-
        Finally, go to Clients, go to Practice Settings, click Edit, select alphabetic order A
        to Z, and click Save. The task is complete after that final Save; take no further
        actions.



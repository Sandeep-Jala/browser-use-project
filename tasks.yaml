    unsubmitted survey, and verify its status is "Sent" (not "Submitted" or "Completed").
    Check the "Submitted On" column for this entry and verify it is blank or empty.
  tags: [nps]

nps_34_report_open_form:
  prompt: >-
    Go to Reports → Review Analysis Report → NPS Survey Report tab. Locate any survey entry
    in the list, find the button or icon to open the NPS form for that entry, click it, and
    verify that the correct NPS survey form opens (matching the reference number of the
    selected entry).
  tags: [nps]

nps_35_multi_year_collection:
  prompt: >-
    Go to clients and select a business name randomly. and send an NPS survey with "Review
    for" set to a specific person (e.g. the Accountant). Open the survey form and submit a
    rating of 8. After the first is submitted, send a second NPS survey to the same client
    with "Review for" set to the same person. Open the new survey form, verify that the form
    does NOT show a "survey already submitted" message or prevent submission. Submit the
    second survey with a rating of 9, verify the submission is successful, and check the
    Reviews list to confirm both surveys/reviews are present separately.
  tags: [nps]

nps_36_all_in_one_report:
  prompt: >-
    Go to Reports → Review Analysis Report. Under the "Review Analysis Report" tab, verify UI
    controls one by one: click on a reference number to ensure the side panel opens and
    closes correctly; click the Refresh button to ensure report data reloads; click
    Download/Export to ensure a download triggers; enter a reference number or name in Search
    to verify filtering; apply a From Date and To Date to verify date filtering; add a
    "Criteria" → "Rating" filter to verify specific result filtering; and test the pagination
    controls. Then, select the "NPS Survey Report" tab and verify the same set of UI controls
    (reference number click, refresh, download, search, date filters, rating filter, and
    pagination). Lastly, next to any NPS entry, click the "Open NPS Survey" button, select a
    rating of 8 out of 10 on the new page, submit it, and verify the submission is
    successful.
  tags: [nps]


